<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind CSS Course | PhineX Academy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --neon: #39ff14;
            --bg: #0a0a0a;
            --card-bg: #1a1a1a;
            --text: #ffffff;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; padding: 40px 20px; }
        .course-container { width: 100%; max-width: 800px; }
        .course-heading { color: var(--neon); font-size: 2rem; display: flex; align-items: center; gap: 15px; margin-bottom: 10px; }
        .progress-container { background: #333; height: 8px; border-radius: 10px; margin: 20px 0; overflow: hidden; }
        #progress-bar { background: var(--neon); width: 0%; height: 100%; transition: all 0.3s ease; }
        .search-box { width: 100%; padding: 12px 15px; background: var(--card-bg); border: 1px solid #333; border-radius: 8px; color: white; margin-bottom: 20px; }
        .course-menu { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 10px; }
        .course-menu-item { background: var(--card-bg); border: 1px solid #333; border-radius: 4px; display: flex; align-items: center; padding: 0 15px; transition: all 0.3s; }
        .course-menu-item:hover { border-color: var(--neon); transform: translateX(5px); }
        .course-menu-item a { text-decoration: none; color: var(--text); flex-grow: 1; padding: 15px 0; }
        .course-menu-item.completed a { color: #888; text-decoration: line-through; }
        .check-icon { color: #333; margin-right: 15px; cursor: pointer; transition: all 0.3s; }
        .course-menu-item.completed .check-icon { color: var(--neon); }
    </style>
</head>
<body>
<div class="course-container">
    <div class="course-header">
        <h3 class="course-heading"><i class="fab fa-css3-alt"></i> Tailwind CSS Course</h3>
        <p>Master utility-first CSS framework</p>
        <div class="progress-container"><div id="progress-bar"></div></div>
    </div>

    <input type="text" id="searchInput" class="search-box" placeholder="Search lessons...">

    <ul class="course-menu" id="courseMenu">
        <li class="course-menu-item">
            <i class="fas fa-check-circle check-icon"></i>
            <a href="lessons.html">Lessons</a>
        </li>
        <li class="course-menu-item">
            <i class="fas fa-check-circle check-icon"></i>
            <a href="workshop.html">Workshops</a>
        </li>
        <li class="course-menu-item">
            <i class="fas fa-check-circle check-icon"></i>
            <a href="quiz.html">Quiz</a>
        </li>
    </ul>
</div>

<script>
    const searchInput = document.getElementById('searchInput');
    const menuItems = document.querySelectorAll('.course-menu-item');
    const progressBar = document.getElementById('progress-bar');

    searchInput.addEventListener('keyup', (e) => {
        const term = e.target.value.toLowerCase();
        menuItems.forEach(item => {
            const text = item.innerText.toLowerCase();
            item.style.display = text.includes(term) ? 'flex' : 'none';
        });
    });

    function updateProgress() {
        const total = menuItems.length;
        const completed = document.querySelectorAll('.course-menu-item.completed').length;
        const percentage = (completed / total) * 100;
        progressBar.style.width = percentage + '%';
    }

    const checkIcons = document.querySelectorAll('.check-icon');
    checkIcons.forEach(icon => {
        icon.addEventListener('click', () => {
            const parent = icon.parentElement;
            parent.classList.toggle('completed');
            updateProgress();
        });
    });

    updateProgress();
</script>
</body>
</html>
